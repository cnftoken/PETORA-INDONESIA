name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  lint:
    name: Lint (ESLint, Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check "src/**" "supabase/migrations/**" "*.{json,yml,yaml,md,ts,tsx}"

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-unit:
    name: Tes unit dan integrasi (Vitest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  test-db:
    name: Tes database (pgTAP)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.12.0.000
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/download/v3.2.0/supabase_3.2.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin
      - run: pnpm install --frozen-lockfile --allow-build=esbuild
      - name: Generate types
        run: |
          cp .env.example .env
          pnpm exec supabase gen types typescript --local > src/types/database.gen.ts 2>/dev/null || true
      - name: Reset DB dan jalankan migrasi
        env:
          SUPABASE_DB_PASSWORD: postgres
        run: |
          pnpm exec supabase start --no-docker 2>/dev/null || true
          pnpm exec supabase db reset --linked 2>/dev/null || true
          pnpm exec supabase db reset 2>&1 | tail -5 || true
      - name: Jalankan tes pgTAP
        env:
          PGPASSWORD: postgres
        run: pnpm exec supabase test db

  test-e2e:
    name: Tes e2e (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e

  build:
    name: Build produksi
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-db, test-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
